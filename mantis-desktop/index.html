<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeployMantis Reliability Suite - Launcher</title>
  <style>
    :root {
      --deploymantis-bg-primary: #1c1c1c;
      --deploymantis-text-primary: #f4f4f0;
      --deploymantis-accent-primary: #8a9a86;
    }
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(145deg, #0f0f0f 0%, #1c1c1c 40%, #2a2a2a 100%);
      color: var(--deploymantis-text-primary);
      font-family: 'Inter', -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .launcher-card {
      background: rgba(30, 30, 30, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(138, 154, 134, 0.15);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 24px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    h1 span {
      color: var(--deploymantis-accent-primary);
    }
    p {
      color: #888880;
      font-size: 14px;
      margin-bottom: 30px;
    }
    .btn {
      background: rgba(138, 154, 134, 0.1);
      border: 1px solid var(--deploymantis-accent-primary);
      color: var(--deploymantis-accent-primary);
      padding: 12px 24px;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      width: 100%;
    }
    .btn:hover {
      background: rgba(138, 154, 134, 0.2);
      box-shadow: 0 0 15px rgba(138, 154, 134, 0.3);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      border-color: #555;
      color: #aaa;
    }
    #status {
      margin-top: 20px;
      font-size: 12px;
      color: var(--deploymantis-accent-primary);
      min-height: 15px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="launcher-card">
    <h1>DeployMantis<span>Suite</span></h1>
    <p>Enterprise AI-native SRE</p>
    <button id="startBtn" class="btn">One-Click Start</button>
    <div id="status"></div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
