

services:
  strata:
    build:
      context: ./strata
    ports:
    container_name: strata
    ports:
      - "3002:3002"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - LOG_LEVEL=info
      - STRATA_BUFFER_SIZE=${STRATA_BUFFER_SIZE:-50}

  mantis-env:
    build:
      context: ./mantis-env
    container_name: mantis-env
    ports:
      - "8000:8000"
    environment:
      - CORE_API_URL=http://core-api:4000

  core-api:
    build:
      context: ./core-api
    container_name: core-api
    ports:
      - "4000:4000"
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock
    environment:
      - STRATA_URL=http://strata:3002
      - MANTIS_ENV_URL=http://mantis-env:8000
      - CUSTOM_MODEL_NAME=${CUSTOM_MODEL_NAME:-llama3.2}
      - INFERENCE_PROVIDER=${INFERENCE_PROVIDER:-ollama}
    depends_on:
      - strata
      - mantis-env

  swarm-chaos:
    build:
      context: ./swarm-chaos
    container_name: swarm-chaos
    ports:
      - "5000:5000"
    environment:
      - CORE_API_URL=http://core-api:4000
      - CHAOS_PROBABILITY=${CHAOS_PROBABILITY:-0.2}
    depends_on:
      - core-api

  vault-guard:
    build:
      context: ./vault-guard
    container_name: vault-guard
    ports:
      - "5001:5001"

  token-breaker:
    build:
      context: ./token-breaker
    container_name: token-breaker
    ports:
      - "5002:5002"
    environment:
      - MAX_BUDGET=${MAX_BUDGET:-1.00}

  mantis-dash:
    build:
      context: ./mantis-dash
      dockerfile: Dockerfile
    container_name: mantis-dash
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_CORE_API_URL=http://localhost:4000
    depends_on:
      - core-api
