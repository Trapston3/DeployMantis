---
# AegisDash
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-aegis-dash
  labels:
    {{- $labels | nindent 4 }}
    component: aegis-dash
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- $labels | nindent 6 }}
      component: aegis-dash
  template:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
        component: aegis-dash
    spec:
      containers:
        - name: aegis-dash
          image: "{{ .Values.image.repository }}-aegis-dash:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_CORE_API_URL
              value: "http://core-api:4000"
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-dash
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30001
  selector:
    {{- $labels | nindent 4 }}
    component: aegis-dash
