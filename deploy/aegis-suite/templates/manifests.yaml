{{- $fullname := include "aegis-suite.fullname" . -}}
{{- $labels := include "aegis-suite.labels" . -}}

{{/* Helper functions for labels (inlined for simplicity or assumed available) */}}
{{- define "aegis-suite.name" -}}
{{- default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" -}}
{{- end -}}
{{- define "aegis-suite.fullname" -}}
{{- $name := default .Chart.Name .Values.nameOverride -}}
{{- printf "%s-%s" .Release.Name $name | trunc 63 | trimSuffix "-" -}}
{{- end -}}
{{- define "aegis-suite.labels" -}}
helm.sh/chart: {{ include "aegis-suite.chart" . }}
app.kubernetes.io/name: {{ include "aegis-suite.name" . }}
app.kubernetes.io/instance: {{ .Release.Name }}
{{- end -}}
{{- define "aegis-suite.chart" -}}
{{- printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" -}}
{{- end -}}

---
# Strata
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-strata
  labels:
    {{- $labels | nindent 4 }}
    component: strata
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- $labels | nindent 6 }}
      component: strata
  template:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
        component: strata
    spec:
      containers:
        - name: strata
          image: "{{ .Values.image.repository }}-strata:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: STRATA_BUFFER_SIZE
              value: {{ .Values.env.STRATA_BUFFER_SIZE | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: strata
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    {{- $labels | nindent 4 }}
    component: strata

---
# AegisEnv
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-aegis-env
  labels:
    {{- $labels | nindent 4 }}
    component: aegis-env
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- $labels | nindent 6 }}
      component: aegis-env
  template:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
        component: aegis-env
    spec:
      containers:
        - name: aegis-env
          image: "{{ .Values.image.repository }}-aegis-env:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-env
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    {{- $labels | nindent 4 }}
    component: aegis-env

---
# Core API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-core-api
  labels:
    {{- $labels | nindent 4 }}
    component: core-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- $labels | nindent 6 }}
      component: core-api
  template:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
        component: core-api
    spec:
      containers:
        - name: core-api
          image: "{{ .Values.image.repository }}-core-api:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 4000
          env:
            - name: STRATA_URL
              value: "http://strata:3000"
            - name: AEGIS_ENV_URL
              value: "http://aegis-env:8000"
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
---
apiVersion: v1
kind: Service
metadata:
  name: core-api
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 4000
      targetPort: 4000
  selector:
    {{- $labels | nindent 4 }}
    component: core-api

